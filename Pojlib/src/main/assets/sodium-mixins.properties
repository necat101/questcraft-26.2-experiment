# QuestCraft runs Minecraft through Android/MobileGlues instead of a desktop
# LWJGL window. Keep Sodium enabled, but leave desktop-only context/window
# workaround mixins off so they do not interfere with Android GL startup.
mixin.workarounds.context_creation=false
mixin.workarounds.event_loop=false
mixin.workarounds.window_minimized_state=false
